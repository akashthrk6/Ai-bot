<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>මගේ AI Bot</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-box { width: 400px; height: 600px; background: #1e293b; border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .header { background: #3b82f6; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; }
    .chat-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.5; white-space: pre-wrap;}
    .user { background: #3b82f6; align-self: flex-end; }
    .bot { background: #334155; align-self: flex-start; }
    .input-area { display: flex; padding: 10px; border-top: 1px solid #334155; }
    .input-area input { flex: 1; padding: 10px; border: none; background: #334155; color: #fff; border-radius: 10px; outline: none; }
    .input-area button { margin-left: 10px; padding: 10px 20px; border: none; background: #3b82f6; color: #fff; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>

<div class="chat-box">
    <div class="header">🤖 මගේ AI සහායකයා</div>
    <div class="chat-area" id="chatArea">
        <div class="msg bot">ආයුබෝවන්! මට මොනවද උදව් කරන්න පුළුවන්?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="ඔයාගේ ප්‍රශ්නය මෙතන ටයිප් කරන්න..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">Send</button>
    </div>
</div>

<script>
    const API_KEY = "Gemini API"; 
    const chatArea = document.getElementById('chatArea');

    async function sendMsg() {
        const input = document.getElementById('userInput');
        const userText = input.value.trim();
        if (!userText) return;

        addMessage(userText, 'user');
        input.value = '';
        addMessage('ටයිප් කරනවා...', 'bot', true);

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userText }] }]// <-- මේක තමයි හදාගත්තේ
                })
            });

            const data = await response.json();
            removeLoading();

            if (data.error) {
                addMessage('API Error: ' + data.error.message, 'bot');
                return;
            }

            const botReply = data.candidates[0].content.parts[0].text;
            addMessage(botReply, 'bot');

        } catch (error) {
            removeLoading();
            addMessage('Error: ' + error.message, 'bot');
            console.error(error);
        }
    }

    function addMessage(text, type, isLoading = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        msgDiv.innerText = text;
        if(isLoading) msgDiv.id = 'loading';
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeLoading() {
        const loading = document.getElementById('loading');
        if(loading) loading.remove();
    }
</script>
</body>
</html>
